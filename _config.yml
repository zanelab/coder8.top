# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Learn AI Coding
email: zane.deng@foxmail.com
author: zane.deng
copyright: Copyright © 2020-2026
description: >- # this means to ignore newlines until "baseurl:"
  We aggregate hands‑on tutorials, in‑depth tool reviews, and ecosystem reports
  for developers who want to master AI coding assistants (Copilot, Cursor, 
  CodeLlama, and more). No noise, just actionable insights to help you choose, 
  use, and build with AI. Your first stop for AI coding literacy.

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://www.coder8.top" # the base hostname & protocol for your site, e.g. http://example.com
favicon: "/favicon.png" # the favicon for your site
logo: "/assets/images/seo-logo.jpg" # logo image for SEO and social sharing (1200x630)

# Yat date format
# refer to https://shopify.github.io/liquid/filters/date/ if you want to customize this
yat:
  date_format: "%d %b %Y"

# If you want more debug log, you can set true
# debug: true

# If you want transparent header, you can set true
# header_transparent: false

# Google Search Console verification
google_site_verification: "O74onlWS_Tey0FC-6_BjnWnFDr2zhzlmU4xtXLWHcqQ"

# Google analytics - GA4
google_analytics: "G-376YJM74PB"
enableDNT: "false"

# Bing Webmaster verification (optional)
# bing_site_verification: "your-bing-verification-code"

# If you want to generate website sitemap, you can set true
sitemap: true

lang: "en"  # default lang is en

# You can choose a theme color
# Default theme colors as below:
# coolblack: #090a0b
# spacegrey: #353535
# snowwhite: #ffffff
#
theme_color: snowwhite
#
# Custom color as below:
# theme_color: "#882250"

# If you want to link only specific pages in your header, uncomment
# this and add the path to the pages in order as they should show up
header_pages:
  - index.html
  - archives.html
  - categories.html
  - tags.html
  - about.md

# Pagination setting
paginate: 10

# Disqus comments
disqus:
  shortname: "code8"

# Gitment comments
# gitment:
#   username: ""
#   repo: ""
#   client_id: ""
#   client_secret: ""
#   redirect_uri: ""

# Build settings
markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-spaceship
  - jekyll-remote-theme

sass:
  quiet_deps: true
